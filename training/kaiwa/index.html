  <header class="masthead">
    <h1 class="title" lang="ja">生活会話</h1>
    <p class="subtitle">Seikatsu Kaiwa &middot; Keigo Sehari-hari di Jepang</p>
    <p class="countdown" id="countdown" hidden></p>
  </header>

  <main class="stage" id="main">

    <!-- pencarian -->
    <div class="search">
      <input type="search" id="search" placeholder="Cari: 袋, kantong, fukuro, sakit…  ( / )" autocomplete="off" aria-label="Cari kartu" />
    </div>

    <!-- filter kategori -->
    <nav class="toolbar" id="filters" aria-label="Filter kategori"></nav>

    <!-- filter peran + toggle tampilan -->
    <div class="options">
      <div class="segmented" id="roles" role="group" aria-label="Filter peran">
        <button data-role="all" aria-pressed="true"><span lang="ja">全部</span><span>Semua</span></button>
        <button data-role="聞" aria-pressed="false"><span lang="ja">聞く</span><span>Dengar</span></button>
        <button data-role="話" aria-pressed="false"><span lang="ja">話す</span><span>Ucap</span></button>
      </div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="tg-furigana" checked /> Furigana</label>
        <label class="toggle"><input type="checkbox" id="tg-romaji" checked /> Romaji</label>
        <label class="toggle" title="Teks disembunyikan, dengarkan suaranya lalu tebak artinya"><input type="checkbox" id="tg-listen" /> Mode dengar</label>
        <label class="toggle"><input type="checkbox" id="tg-slow" /> Suara lambat</label>
      </div>
    </div>

    <!-- progres -->
    <div class="progress-row">
      <span class="counter" id="counter"></span>
      <span class="progress-track"><span class="progress-fill" id="fill"></span></span>
    </div>

    <!-- kartu -->
    <div class="card-scene">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Kartu percakapan, klik untuk membalik">
        <div class="face face-front">
          <div class="badges">
            <span class="badge" id="badge" lang="ja"></span>
            <span class="role" id="role" lang="ja"></span>
          </div>
          <div class="jp-line" id="jp" lang="ja">Memuat…</div>
          <button class="listen-prompt" id="listen-prompt" type="button">▶ <span lang="ja">聞く</span><span>Dengarkan, lalu tebak artinya</span></button>
          <div class="romaji-line" id="romaji"></div>
          <div class="hint">Klik / Spasi untuk arti</div>
          <div class="seal" aria-hidden="true" lang="ja">済</div>
        </div>
        <div class="face face-back">
          <div class="meaning" id="meaning"></div>
          <div class="reading" id="reading" lang="ja"></div>
          <div class="reply" id="reply" hidden>
            <span class="reply-label"><span lang="ja">返事</span> · Jawaban</span>
            <div class="reply-text" id="reply-text" lang="ja"></div>
          </div>
          <div class="note" id="note"></div>
        </div>
      </div>
    </div>

    <!-- kontrol -->
    <div class="controls">
      <button class="btn" id="btn-prev"><span lang="ja">前へ</span><span class="k">← Sebelum</span></button>
      <button class="btn btn-primary" id="btn-flip"><span lang="ja">意味</span><span class="k">Spasi · Balik</span></button>
      <button class="btn" id="btn-learn"><span lang="ja">覚えた</span><span class="k">L · Kuasai</span></button>
      <button class="btn" id="btn-next"><span lang="ja">次へ</span><span class="k">→ Lanjut</span></button>
    </div>

    <div class="controls controls-3">
      <button class="btn" id="btn-speak"><span lang="ja">音声</span><span class="k">A · Dengar suara</span></button>
      <button class="btn" id="btn-shuffle" aria-pressed="false"><span lang="ja">シャッフル</span><span class="k">S · Acak urutan</span></button>
      <button class="btn" id="btn-hide" aria-pressed="false"><span lang="ja">未習のみ</span><span class="k">H · Belum hafal</span></button>
    </div>

  </main>
